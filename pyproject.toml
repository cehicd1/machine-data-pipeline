[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-pipeline"
version = "0.1.0"
description = "PySpark medallion pipeline (bronze/silver/gold) for synthetic CNC production data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
machine_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N812"]  # `from pyspark.sql import functions as F` is the PySpark convention

[tool.ruff.lint.per-file-ignores]
# Notebook globals (spark, dbutils, display) and imports after sys.path setup.
"databricks/*.py" = ["F821", "E402"]
